<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="ct cd">
<title id="ct">RoPE on the CPU: time per rotated pair</title>
<desc id="cd">Nanoseconds per rotated pair, lower is better. Decode step at m = 4095 [1, 1, 32, 128]: direct (sin_cos per pair) 10.1 ns, SinCosTable 0.61 ns, SinCosTable + 16 threads 0.62 ns; Short prompt [1, 128, 8, 64]: direct (sin_cos per pair) 8.07 ns, SinCosTable 0.67 ns, SinCosTable + 16 threads 17.9 ns; Batch, fits in L3 [2, 512, 16, 64]: direct (sin_cos per pair) 8.71 ns, SinCosTable 0.73 ns, SinCosTable + 16 threads 1.18 ns; LLaMA-like prefill [1, 2048, 32, 128]: direct (sin_cos per pair) 9.33 ns, SinCosTable 1.84 ns, SinCosTable + 16 threads 1.12 ns.</desc>
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df;
         --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#2f2f2d;
           --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  .bg { fill: var(--surface); }
  .t1 { font: 600 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--ink); }
  .t2 { font: 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--ink2); }
  .lab { font: 600 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--ink); }
  .sub { font: 12px 'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; fill: var(--ink2); }
  .val { font: 12px 'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; fill: var(--ink); }
  .tick { font: 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--muted); stroke-width: 1; }
  .s0 { fill: var(--s1); } .s1 { fill: var(--s2); } .s2 { fill: var(--s3); }
</style>
