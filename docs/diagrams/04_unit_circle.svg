<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="260" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">The unit circle: (cos θ, sin θ)</text><line x1="50" y1="225" x2="460" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="250" y1="415" x2="250" y2="30" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="250" cy="225" r="150" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="250" y1="225" x2="354.50600640207483" y2="117.39658636507158" stroke="#c2410c" stroke-width="2.5"/><line x1="354.50600640207483" y1="117.39658636507158" x2="354.50600640207483" y2="225" stroke="#15803d" stroke-width="2" stroke-dasharray="5,3"/><line x1="250" y1="225" x2="354.50600640207483" y2="225" stroke="#b91c1c" stroke-width="3"/><circle cx="354.50600640207483" cy="117.39658636507158" r="4" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><path d="M 290 225 A 40 40 0 0 0 277.9 196.3" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="305" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="bold">θ</text><text x="362.50600640207483" y="109.39658636507158" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c2410c" font-weight="normal">(cos θ, sin θ)</text><text x="302.2530032010374" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="normal">cos θ</text><text x="362.50600640207483" y="171.1982931825358" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#15803d" font-weight="normal">sin θ</text><circle cx="400.0" cy="225.0" r="3.5" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="410.0" y="217.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">θ = 0: (1, 0)</text><circle cx="250.0" cy="75.0" r="3.5" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="258.0" y="69.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">π/2: (0, 1)</text><circle cx="100.0" cy="224.99999999999997" r="3.5" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="92.0" y="216.99999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="end" fill="#111827" font-weight="normal">π: (−1, 0)</text><circle cx="249.99999999999997" cy="375.0" r="3.5" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="258.0" y="393.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">3π/2: (0, −1)</text><text x="260" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">radius 1, so cos²θ + sin²θ = 1; one full turn = 2π rad</text></svg>