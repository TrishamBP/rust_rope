<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="280" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Complex multiplication by e^(iθ) is a rotation</text><line x1="30" y1="300" x2="510" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="260" y1="380" x2="260" y2="40" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="510" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">Re</text><text x="242" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">Im</text><line x1="260" y1="300" x2="345.0" y2="130.0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="353.0" y="124.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">z = 1 + 2i</text><line x1="260" y1="300" x2="162.87562858144946" y2="136.62357429374504" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text x="154.87562858144946" y="130.62357429374504" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#c2410c" font-weight="normal">z·e^(i·1) = −1.1426 + 1.9221i</text><path d="M 291.3 237.4 A 70 70 0 0 0 224.2 239.8" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="254" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="bold">+θ = 1 rad</text><circle cx="260" cy="300" r="190.06577808748213" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/><text x="280" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">|z·e^(iθ)| = |z|·1 = √5;  arg(z·e^(iθ)) = arg(z) + θ = 1.1071 + 1 = 2.1071</text></svg>