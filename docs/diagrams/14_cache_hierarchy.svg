<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="410" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">CPU memory hierarchy (this computer: AMD Ryzen 7 6800H, 8 cores / 16 threads)</text><rect x="330.0" y="50" width="160" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="410.0" y="72.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Registers</text><text x="410.0" y="89.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">16 general + 16 vector registers per core</text><rect x="260.0" y="112" width="300" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="410.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">L1 data cache</text><text x="410.0" y="151.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">32 KiB per core (Zen 3+ specification)</text><rect x="220.0" y="174" width="380" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="410.0" y="196.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">L2 cache</text><text x="410.0" y="213.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">512 KiB per core (4 MiB total, reported by Windows)</text><rect x="150.0" y="236" width="520" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="410.0" y="258.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">L3 cache</text><text x="410.0" y="275.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">16 MiB shared (reported by Windows)</text><rect x="60.0" y="298" width="700" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="410.0" y="320.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Main memory (DRAM)</text><text x="410.0" y="337.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">15.2 GiB installed</text><text x="410" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" font-style="italic">Higher levels are smaller and faster. Data moves in cache lines of 64 bytes (8 × f64).</text></svg>