)"/><rect x="90" y="422" width="640" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="410.0" y="443.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">angles φ = m·θⱼ (angle_unchecked), sin_cos(φ)</text><text x="410.0" y="460.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">frequencies.rs, math/trigonometry.rs</text><line x1="410" y1="472" x2="410" y2="484" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="90" y="484" width="640" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="410.0" y="505.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">rotate each pair (rotate_pair → rotate_vector) for Q and K</text><text x="410.0" y="522.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">rotations.rs, math/matrix.rs, embeddings.rs</text><line x1="410" y1="534" x2="410" y2="546" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="90" y="546" width="640" height="50" rx="6" fill="#f3f4f6" stroke="#111827" stroke-width="1.2" stroke-dasharray="5,4"/><text x="410.0" y="567.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">attention scores Q'·K'ᵀ (only as a test property)</text><text x="410.0" y="584.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151" font-weight="normal">not implemented as a feature</text></svg>